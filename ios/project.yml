name: ShippoTV
options:
  bundleIdPrefix: app.shippotv
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "5.3.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    ENABLE_BITCODE: NO
    DEVELOPMENT_TEAM: ""
targets:
  ShippoTV:
    type: application
    platform: iOS
    sources:
      - path: ShippoTV
        excludes:
          - "web"
          - "web/**"
      - path: ShippoTV/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.shippotv.ipad.vlc4
        PRODUCT_NAME: ShippoTV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: ShippoTV/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: ShippoTV/Info.plist
      properties:
        CFBundleDisplayName: ShippoTV β
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
        LSApplicationQueriesSchemes:
          - youtube
