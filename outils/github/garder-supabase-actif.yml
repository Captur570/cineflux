# ShippoTV : garde le serveur de synchronisation (Supabase gratuit) actif.
# Supabase met en pause les projets gratuits après une semaine sans activité. Ce petit
# programme, lancé par GitHub tous les 3 jours, fait une requête minuscule pour l'en empêcher.
#
# Mise en place (une seule fois), sur la page GitHub de votre dépôt :
#   1. Settings > Secrets and variables > Actions > New repository secret :
#        SUPABASE_URL = l'adresse de votre projet (https://xxxx.supabase.co)
#        SUPABASE_KEY = la clé « publishable » (sb_publishable_…), jamais la clé secrète
#   2. Add file > Create new file, nom : .github/workflows/garder-supabase-actif.yml
#      et collez tout ce fichier, puis « Commit changes ».
name: Garder Supabase actif
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Requête légère au serveur de synchronisation
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          URL="${URL%/}"; URL="${URL%/rest/v1}"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/cf_pull" \
            -H "apikey: $KEY" -H "Content-Type: application/json" \
            -d '{"p_gid":"keepalive","p_since":null,"p_after_k":""}')
          echo "Réponse : $code"
          test "$code" -lt 500
