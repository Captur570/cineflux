# Fabrique les outils ATVLoad :
#  - plumesign-windows-x86_64.exe : moteur de signature/installation (PlumeImpactor, variante bitxeno, licence MIT)
#  - HelloTV.ipa : petite app tvOS de test, non signée, pour valider l'installation sur l'Apple TV
# Publiés dans la release "atv-tools" du dépôt.
name: Outils Apple TV (ATVLoad)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/atv-tools.yml", "tools/hellotv/**", "tools/atvload/**"]
permissions:
  contents: write
concurrency:
  group: atv-tools
  cancel-in-progress: true
env:
  PLUME_REPO: bitxeno/PlumeImpactor
  PLUME_REF: v2.7.0-patch.1

jobs:
  plumesign-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: plume
    steps:
      - uses: actions/checkout@v4
        with:
          path: atv
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.PLUME_REPO }}
          ref: ${{ env.PLUME_REF }}
          submodules: recursive
          path: plume
      - name: Correctifs ATVLoad (serveur anisette configurable, pas de plantage)
        run: python ../atv/tools/atvload/patch_plume.py .
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plume
      - name: Compilation de plumesign
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "false"
          CARGO_PROFILE_RELEASE_SPLIT_DEBUGINFO: "off"
        run: cargo build -p plumesign --release
      - name: Vérification
        run: |
          target\release\plumesign.exe --help
          target\release\plumesign.exe sign-rsd --help
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\plumesign.exe dist\plumesign-windows-x86_64.exe
          Get-FileHash dist\plumesign-windows-x86_64.exe -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: plumesign-windows
          path: plume/dist/plumesign-windows-x86_64.exe

  hellotv:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: brew install xcodegen
      - name: Projet Xcode
        working-directory: tools/hellotv
        run: xcodegen generate
      - name: Fabrication tvOS (non signée)
        working-directory: tools/hellotv
        run: |
          set -o pipefail
          xcodebuild -project HelloTV.xcodeproj -scheme HelloTV -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -20
          APP=build/Build/Products/Release-appletvos/HelloTV.app
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print :CFBundleSupportedPlatforms" "$APP/Info.plist"
          rm -rf Payload && mkdir Payload && cp -R "$APP" Payload/
          zip -qry HelloTV.ipa Payload && ls -la HelloTV.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: hellotv
          path: tools/hellotv/HelloTV.ipa

  # Interface graphique : ATVLoad.exe (Python + pywebview empaquetés, aucune installation nécessaire)
  atvload-exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: python -m pip install pywebview zeroconf pyinstaller
      - name: Fabrication de ATVLoad.exe
        working-directory: tools/atvload
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name ATVLoad --icon atvload.ico
          --add-data "atvload_gui.html;." --collect-submodules zeroconf --collect-submodules webview
          --hidden-import atvload atvload_gui.py
      - name: Vérifications (mode ligne de commande, puis ouverture de la fenêtre)
        working-directory: tools/atvload
        shell: pwsh
        run: |
          $p = Start-Process dist\ATVLoad.exe -ArgumentList "list" -Wait -PassThru
          "ligne de commande : code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          $g = Start-Process dist\ATVLoad.exe -PassThru
          Start-Sleep -Seconds 12
          if ($g.HasExited) { "la fenêtre s'est fermée (code $($g.ExitCode))"; Get-Content "$env:APPDATA\ATVLoad\atvload.log" -ErrorAction SilentlyContinue; exit 1 }
          "fenêtre ouverte depuis 12 s : OK"
          Stop-Process -Id $g.Id -Force
          Get-Item dist\ATVLoad.exe | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: atvload-exe
          path: tools/atvload/dist/ATVLoad.exe

  atvload-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive de l'outil
        run: |
          mkdir -p dist/ATVLoad
          cp tools/atvload/atvload.py tools/atvload/atvload.bat tools/atvload/LISEZMOI.md tools/atvload/atvload_gui.py tools/atvload/atvload_gui.html tools/atvload/atvload.ico dist/ATVLoad/
          cd dist && zip -qr ATVLoad.zip ATVLoad && ls -la ATVLoad.zip
      - uses: actions/upload-artifact@v4
        with:
          name: atvload
          path: dist/ATVLoad.zip

  publication:
    runs-on: ubuntu-latest
    needs: [plumesign-windows, hellotv, atvload-zip, atvload-exe]
    if: always() && (needs.plumesign-windows.result == 'success' || needs.hellotv.result == 'success')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: atv-tools
          name: Outils Apple TV (ATVLoad)
          prerelease: true
          files: dist/*
          body: |
            Outils pour installer des apps tvOS sur Apple TV depuis Windows avec un Apple ID gratuit.
            - plumesign-windows-x86_64.exe : compilé depuis ${{ env.PLUME_REPO }}@${{ env.PLUME_REF }} (licence MIT).
            - ATVLoad.exe : l'outil avec sa fenêtre (double-clic, rien à installer).
            - ATVLoad.zip : le même outil en Python, pour la ligne de commande (voir LISEZMOI.md à l'intérieur).
            - HelloTV.ipa : app tvOS de test (non signée), à installer avec `atvload install HelloTV.ipa`.
            Fabrication n°${{ github.run_number }}.
