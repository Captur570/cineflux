# ShippoTV pour Android TV (Freebox Player Pop et autres boîtiers) : fabrication automatique sur GitHub,
# essais dans un émulateur Android TV, puis publication de ShippoTV-Android.apk (release android-beta).
name: Appli Android TV
on:
  push:
    branches: [main]
    paths: ["android/**", "tv/**", "web/**", "outils/build_android.py", "outils/build_ios.py", ".github/workflows/android.yml", "version.txt", "ios/ci/mock.py"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Interface ShippoTV embarquée
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python3 outils/build_android.py
      - name: Clé de signature (toujours la même, pour que les mises à jour s'installent par-dessus)
        env:
          GH_TOKEN: ${{ github.token }}
          K: ${{ secrets.TMDB_KEY }}
        run: |
          test -n "$K" || { echo "secret manquant"; exit 1; }
          P=$(printf 'shippotv-android-ks:%s' "$K" | sha256sum | cut -c1-32)
          echo "::add-mask::$P"
          echo "KS_PASS=$P" >> $GITHUB_ENV
          TAG=android-signing
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --prerelease --target "${{ github.sha }}" --title "Android - signature" --notes "Fichier chiffré utilisé par la fabrication (rien à installer)."
          if gh release download $TAG -p shippotv.jks.enc -D /tmp 2>/dev/null; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:P -in /tmp/shippotv.jks.enc -out android/shippotv.jks
            echo "clé existante"
          else
            keytool -genkeypair -keystore android/shippotv.jks -storetype PKCS12 -alias shippotv -keyalg RSA -keysize 2048 -validity 15000 \
              -storepass "$P" -keypass "$P" -dname "CN=ShippoTV, O=ShippoTV, C=FR"
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:P -in android/shippotv.jks -out /tmp/shippotv.jks.enc
            gh release upload $TAG /tmp/shippotv.jks.enc --clobber
            echo "nouvelle clé créée"
          fi
        shell: bash
      - name: Fabrication (apk)
        run: |
          set -o pipefail
          gradle -p android assembleRelease --stacktrace 2>&1 | tee android/build.log
          ls -la android/app/build/outputs/apk/release/
      - name: Résumé des erreurs de fabrication
        if: failure()
        run: grep -E "^e: |error:|FAILURE|What went wrong" -A3 android/build.log | head -150 || true
      - name: KVM pour l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Essais dans l'émulateur Android TV
        continue-on-error: true
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/run_tests.sh
      - name: Paquet
        if: always()
        run: |
          mkdir -p pub
          A=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          [ -n "$A" ] && cp "$A" pub/ShippoTV-Android.apk
          V="$(cat version.txt) (${{ github.run_number }})"
          printf '{"code": %d, "name": "%s", "apk": "https://github.com/%s/releases/download/android-beta/ShippoTV-Android.apk", "notes": "%s"}\n' \
            $((1000 + ${{ github.run_number }})) "$V" "${{ github.repository }}" "$(git log -1 --pretty=%s | tr -d '"\\' | cut -c1-120)" > pub/android-version.json
          cat pub/android-version.json
          mkdir -p essai && cp android/ci/out/* essai/ 2>/dev/null || true
          [ -f android/build.log ] && grep -E "^[ew]: |error|BUILD|What went wrong" android/build.log | tail -200 > essai/fabrication-resume.txt
          cd essai && zip -q ../essai.zip * ; cd ..
          ls -la pub essai
      - name: Résultats d'essai (branche autre que main)
        if: always() && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-essais
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --prerelease --target "${{ github.sha }}" --title "Android - essais" --notes "Résultats d'essais (pas une version à installer)."
          F=""; [ -f essai.zip ] && F="essai.zip"; [ -f pub/ShippoTV-Android.apk ] && F="$F pub/ShippoTV-Android.apk"
          [ -n "$F" ] && gh release upload $TAG $F --clobber
      - name: Publication (bêta)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=android-beta
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --prerelease --target "${{ github.sha }}" --title "ShippoTV Android TV (bêta)" \
            --notes "Version Android TV de ShippoTV (Freebox Player Pop…). Installation avec l'appli Downloader, puis mises à jour automatiques."
          cp essai.zip pub/essais.zip 2>/dev/null || true
          gh release upload $TAG pub/ShippoTV-Android.apk pub/essais.zip --clobber
          gh release upload $TAG pub/android-version.json --clobber
