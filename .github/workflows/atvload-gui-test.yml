# Essai comparatif (branche gui-test) : la fenêtre publiée (avant) contre la corrigée (après).
name: ATVLoad - essai de la fenêtre
on:
  push:
    branches: [gui-test]
jobs:
  essai:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        version: [avant, apres]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pywebview zeroconf pyinstaller
      - name: Version publiée
        if: matrix.version == 'avant'
        working-directory: tools/atvload
        run: |
          git show origin/main:tools/atvload/atvload_gui.py > atvload_gui.py
          git show origin/main:tools/atvload/atvload_gui.html > atvload_gui.html
          git show origin/main:tools/atvload/atvload.py > atvload.py
      - name: Fabrication
        working-directory: tools/atvload
        run: pyinstaller --noconfirm --onefile --windowed --name ATVLoad --icon atvload.ico --add-data "atvload_gui.html;." --collect-submodules zeroconf --collect-submodules webview --hidden-import atvload atvload_gui.py
      - name: La fenêtre répond-elle ?
        working-directory: tools/atvload
        shell: pwsh
        run: ./ci_check.ps1
