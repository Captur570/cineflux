# Essais « reproduire avant de corriger » sur le simulateur Apple TV (branche repro uniquement) :
# rien n'est publié dans la version bêta, les résultats sont dans l'onglet Actions (artefact « repro »).
name: Apple TV - reproduction
on:
  push:
    branches: [repro]
  workflow_dispatch:
concurrency:
  group: appletv-repro
  cancel-in-progress: true
jobs:
  repro:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Outils
        run: brew install xcodegen
      - name: Moteur ShippoTV embarqué
        run: python3 outils/build_atv.py
      - name: Projet Xcode
        working-directory: tvos
        run: |
          xcodegen generate
          pod install
      - name: Fabrication pour le simulateur
        working-directory: tvos
        run: |
          set -o pipefail
          xcodebuild -workspace ShippoTV.xcworkspace -scheme ShippoTV -configuration Debug -sdk appletvsimulator \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build > build-sim.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-sim.log | head -60 || true
          grep -q "BUILD SUCCEEDED" build-sim.log
      - name: Reproduction
        run: python3 tvos/ci/repro.py
      - name: Résultats
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repro
          path: |
            tvos/ci/repro/
            tvos/build-sim.log
