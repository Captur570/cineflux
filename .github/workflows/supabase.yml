# Garde le projet Supabase (synchronisation, codes d'association, configuration par téléphone) éveillé :
# les projets gratuits se mettent en pause après une semaine sans activité.
name: Supabase éveillé
on:
  schedule:
    - cron: "23 5 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Petite requête au projet
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          U="${URL%/}"; U="${U%/rest/v1}"
          code=$(curl -sS -o /tmp/r.txt -w "%{http_code}" -X POST "$U/rest/v1/rpc/cf_pull" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            -d '{"p_gid":"veille-github"}')
          echo "réponse : $code"; head -c 200 /tmp/r.txt; echo
          if [ "$code" != "200" ]; then echo "::error::Le projet Supabase ne répond pas ($code) : il est peut-être en pause, à réactiver sur supabase.com"; exit 1; fi
