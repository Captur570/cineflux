# ShippoTV pour iPad : fabrication automatique sur un Mac de GitHub.
# Produit : ShippoTV-iPad.ipa (à installer avec AltStore) + captures d'écran du simulateur.
name: Appli iPad
on:
  push:
    branches: [main, vlc4]
    paths: ["ios/**", "web/**", "tv/engine/**", "outils/build_ios.py", ".github/workflows/ipad.yml", "version.txt"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ipad-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  ipad:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: xcodebuild -version && python3 --version && pod --version
      - name: Outils
        run: brew install xcodegen
      - name: Interface web embarquée
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: python3 outils/build_ios.py
      - name: Projet Xcode
        working-directory: ios
        run: |
          sed -i '' "s/MARKETING_VERSION: \".*\"/MARKETING_VERSION: \"$(cat ../version.txt)\"/; s/CURRENT_PROJECT_VERSION: \".*\"/CURRENT_PROJECT_VERSION: \"${GITHUB_RUN_NUMBER}\"/" project.yml
          xcodegen generate
          pod install
      - name: Fabrication pour iPad (ipa)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace ShippoTV.xcworkspace -scheme ShippoTV -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' -derivedDataPath build/dev \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build-dev.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-dev.log | head -60 || true
          grep -q "BUILD SUCCEEDED" build-dev.log
          test -d build/dev/Build/Products/Release-iphoneos/ShippoTV.app
          rm -rf Payload && mkdir Payload
          cp -R build/dev/Build/Products/Release-iphoneos/ShippoTV.app Payload/
          zip -qry ShippoTV-iPad.ipa Payload
          ls -la ShippoTV-iPad.ipa
      - name: Journal de fabrication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-fabrication
          path: ios/build-*.log
      - name: Fichier pour AltStore
        uses: actions/upload-artifact@v4
        with:
          name: ShippoTV-iPad
          path: ios/ShippoTV-iPad.ipa
      - name: Fabrication pour le simulateur
        continue-on-error: true
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace ShippoTV.xcworkspace -scheme ShippoTV -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build > build-sim.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build-sim.log | head -60 || true
      - name: Captures d'écran
        continue-on-error: true
        run: python3 ios/ci/screens.py
      - name: Envoi des captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: ios/ci/out/
      - name: Publication (fichier .ipa, captures et journaux, téléchargeables depuis l'iPad)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # branche main : version normale ; branche vlc4 : version d'essai avec VLC 4, publiée à part
          if [ "${{ github.ref_name }}" = "main" ]; then TAG=ipad-beta; IPA=ShippoTV-iPad.ipa; TITLE="ShippoTV iPad (bêta)"
          else TAG=ipad-vlc4; IPA=ShippoTV-iPad-VLC4.ipa; TITLE="ShippoTV iPad — essai VLC 4"; fi
          gh release view $TAG >/dev/null 2>&1 || gh release create $TAG --prerelease --target "${{ github.sha }}" --title "$TITLE" \
            --notes "Version iPad de ShippoTV, fabriquée automatiquement. À installer avec AltStore : voir GUIDE_IPAD.txt."
          mkdir -p pub
          [ -f ios/ShippoTV-iPad.ipa ] && cp ios/ShippoTV-iPad.ipa pub/$IPA
          for f in ios/ci/out/*.png ios/ci/out/journal.txt; do [ -f "$f" ] && cp "$f" "pub/capture-$(basename "$f")"; done
          for f in ios/build-dev.log ios/build-sim.log; do [ -f "$f" ] && grep -E "error|warning: .*\.swift|BUILD" "$f" | tail -300 > "pub/$(basename "$f" .log)-resume.txt"; done
          echo "run ${{ github.run_number }} $(date -u)" > pub/fabrication.txt
          ls -la pub
          gh release upload $TAG pub/* --clobber
